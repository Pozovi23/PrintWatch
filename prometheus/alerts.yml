---
groups:
  - name: 3d_printers_alerts
    rules:
      - alert: PrinterOffline
        expr: printer_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Printer {{ $labels.printer }} is Offline
          description: >-
            Printer {{ $labels.printer }} has been unreachable via API for more
            than 2 minutes. Check power, network connection, or VPN routing.
      - alert: ExtruderTempDeviation
        expr: >-
          (abs(printer_temperature_celsius{tool="extruder"} -
          printer_temperature_target_celsius{tool="extruder"}) > 5)
          and (printer_temperature_target_celsius{tool="extruder"} > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Extruder temperature deviation on {{ $labels.printer }}
          description: >-
            Extruder temperature differs from target by > 5°C for 5 minutes
            (Current: {{ $value | printf "%.1f" }}°C). Possible heater
            cartridge or thermistor failure.
      - alert: BedTempDeviation
        expr: >-
          (abs(printer_temperature_celsius{tool="bed"} -
          printer_temperature_target_celsius{tool="bed"}) > 3)
          and (printer_temperature_target_celsius{tool="bed"} > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Heated bed temperature deviation on {{ $labels.printer }}
          description: >-
            Heated bed temperature differs from target by > 3°C for 5 minutes
            (Current: {{ $value | printf "%.1f" }}°C).
      - alert: PrintFailed
        expr: printer_state{state="error"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Print failed / Error on {{ $labels.printer }}
          description: >-
            Printer {{ $labels.printer }} entered ERROR state for more than
            1 minute. Print job may have halted.
  - name: host_system_alerts
    rules:
      - alert: HostDiskAlmostFull
        expr: >-
          (node_filesystem_avail_bytes{mountpoint="/"} /
          node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host root disk space is below 10%
          description: >-
            Root filesystem on {{ $labels.instance }} has less than 10%
            disk space remaining for 10 minutes.
      - alert: HostHighCPU
        expr: >-
          (100 - (avg by (instance)
          (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host CPU utilization is critical (> 90%)
          description: >-
            Host {{ $labels.instance }} CPU utilization has been above 90%
            for the last 5 minutes (Current: {{ $value | printf "%.1f" }}%).
