---
# Prometheus configuration for 3D Printers & Host Monitoring
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s
# Alertmanager routing
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
# Load alert rules
rule_files:
  - /etc/prometheus/alerts.yml
# Scrape configurations
scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # 2. Host System Metrics (CPU, RAM, Disks, Network)
  - job_name: node_exporter
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          instance: ubuntu-host

  # 3. 3D Printers Fleet Exporter (Опрашивает все N принтеров параллельно)
  - job_name: printers
    metrics_path: /metrics
    static_configs:
      - targets: [printer-exporter:9108]
